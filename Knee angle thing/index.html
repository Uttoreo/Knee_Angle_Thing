<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knee ROM Tracker - Camera View</title>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .nav { width: 100%; padding: 15px; background: #000; text-align: center; }
        .nav a { color: #00e676; text-decoration: none; font-weight: bold; margin: 0 10px; }
        .container { position: relative; width: 100%; max-width: 600px; height: 50vh; background-color: #000; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        .dashboard { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; background: #1e1e1e; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .metric-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 15px; border-radius: 10px; }
        .metric-label { font-size: 1.1rem; color: #aaa; }
        .metric-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .highlight { color: #00e676; }
        button { background-color: #00e676; color: #000; border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; color: #00e676; }
    </style>
</head>
<body>
    <div class="nav">
        <span>Mode: </span>
        <a href="index.html" style="color:white; border-bottom: 2px solid white;">Camera Overlay</a> | 
        <a href="3d_model_tracker.html">3D Spatial Model</a>
    </div>

    <div class="container">
        <div id="loading">Loading AI Model...</div>
        <video class="input_video"></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <div class="dashboard">
        <div class="metric-row">
            <span class="metric-label">Current Angle</span>
            <span class="metric-value highlight" id="current-angle">--°</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Max Extension</span>
            <span class="metric-value" id="max-ext">--°</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Max Flexion</span>
            <span class="metric-value" id="max-flex">--°</span>
        </div>
        <button onclick="resetMetrics()">Reset Tracking</button>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');

        const currentAngleEl = document.getElementById('current-angle');
        const maxExtEl = document.getElementById('max-ext');
        const maxFlexEl = document.getElementById('max-flex');
        const loadingEl = document.getElementById('loading');

        let maxExtension = 0;   
        let maxFlexion = 180;   

        function resetMetrics() {
            maxExtension = 0; maxFlexion = 180;
            maxExtEl.innerText = "--°"; maxFlexEl.innerText = "--°";
        }

        function calculate3DAngle(a, b, c) {
            const ba = { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
            const bc = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };
            const dotProduct = (ba.x * bc.x) + (ba.y * bc.y) + (ba.z * bc.z);
            const magBA = Math.sqrt(ba.x*ba.x + ba.y*ba.y + ba.z*ba.z);
            const magBC = Math.sqrt(bc.x*bc.x + bc.y*bc.y + bc.z*bc.z);
            return Math.acos(dotProduct / (magBA * magBC)) * (180.0 / Math.PI);
        }

        function onResults(results) {
            if (loadingEl.style.display !== 'none') {
                loadingEl.style.display = 'none';
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseWorldLandmarks;
                const pixelLandmarks = results.poseLandmarks;

                const leftVis = (landmarks[23].visibility + landmarks[25].visibility + landmarks[27].visibility) / 3;
                const rightVis = (landmarks[24].visibility + landmarks[26].visibility + landmarks[28].visibility) / 3;
                const isLeft = leftVis > rightVis;

                const hip = isLeft ? landmarks[23] : landmarks[24];
                const knee = isLeft ? landmarks[25] : landmarks[26];
                const ankle = isLeft ? landmarks[27] : landmarks[28];
                const conf = isLeft ? leftVis : rightVis;

                drawConnectors(canvasCtx, pixelLandmarks, POSE_CONNECTIONS, {color: '#FFFFFF', lineWidth: 2});
                drawLandmarks(canvasCtx, pixelLandmarks, {color: '#00e676', lineWidth: 2, radius: 4});

                if (conf > 0.5) {
                    const angle = Math.round(calculate3DAngle(hip, knee, ankle));
                    currentAngleEl.innerText = angle + "°";
                    if (angle > maxExtension && angle <= 180) { maxExtension = angle; maxExtEl.innerText = angle + "°"; }
                    if (angle < maxFlexion && angle > 0) { maxFlexion = angle; maxFlexEl.innerText = angle + "°"; }
                    
                    const kneePx = isLeft ? pixelLandmarks[25] : pixelLandmarks[26];
                    canvasCtx.font = "30px Arial"; canvasCtx.fillStyle = "#00e676"; canvasCtx.strokeStyle = "black"; canvasCtx.lineWidth = 3;
                    const textX = kneePx.x * canvasElement.width + 20; const textY = kneePx.y * canvasElement.height;
                    canvasCtx.strokeText(angle + "°", textX, textY); canvasCtx.fillText(angle + "°", textX, textY);
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, { onFrame: async () => { await pose.send({image: videoElement}); }, width: 640, height: 480, facingMode: "environment" });
        camera.start();
    </script>
</body>
</html>
